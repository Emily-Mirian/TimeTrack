<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relatórios | Registro de Presença</title>
    <style>
      @import url("../css/style.css");
    </style>
  </head>
  <body class="pagina-app">
    <!-- ======================================================
       MENU LATERAL DO FUNCIONÁRIO (item "Relatórios" ativo)
       ====================================================== -->
    <aside class="menu-lateral">
      <div class="menu-logo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      </div>

      <nav class="menu-itens">
        <button class="menu-item" data-ir="inicio.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" />
          </svg>
          Início
        </button>
        <button class="menu-item" data-ir="ponto.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          Ponto
        </button>
        <button class="menu-item ativo" data-ir="relatorios.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M8 16v-3M12 16V9M16 16v-5" />
          </svg>
          Relatórios
        </button>
        <!-- [FRONT] Atestados abre um modal (Fig. 6). Será ligado quando fizermos essa tela. -->
        <button class="menu-item" data-ir="inicio.html#atestado">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V3h6v1M12 10v6M9 13h6" />
          </svg>
          Atestados
        </button>
        <button class="menu-item" data-ir="configuracoes.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"
            />
          </svg>
          Configurações
        </button>
      </nav>

      <button class="menu-item menu-ajuda">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01" />
        </svg>
        Ajuda
        <span class="seta-direita">›</span>
      </button>
    </aside>

    <!-- ======================================================
       CONTEÚDO PRINCIPAL
       ====================================================== -->
    <main class="conteudo">
      <!-- ---------- Cabeçalho ---------- -->
      <header class="topo">
        <div>
          <h1>Relatórios</h1>
          <p class="texto-suave">Gere e consulte seus espelhos de ponto.</p>
        </div>

        <div class="perfil">
          <button class="perfil-botao" id="btnPerfil">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>
            Meu Perfil
            <span class="seta-baixo">⌄</span>
          </button>
          <div class="perfil-menu oculto" id="menuPerfil">
            <button data-ir="configuracoes.html">Configurações</button>
            <!-- [BACKEND] Sair: POST /api/auth/logout -->
            <button id="btnSair">Sair</button>
          </div>
        </div>
      </header>

      <!-- ======================================================
         LINHA 1: EXPORTAR ESPELHO | SALDO ACUMULADO
         ====================================================== -->
      <section class="linha-relatorios">
        <!-- ---------- Exportar Espelho de Ponto ---------- -->
        <div class="card card-exportar" id="cardExportar">
          <h2 class="card-titulo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z" />
              <path d="M14 3v6h6M12 12v6M9 15l3 3 3-3" />
            </svg>
            Exportar Espelho de Ponto
          </h2>
          <p class="texto-suave pequeno">
            Selecione o mês de referência para gerar o espelho em PDF.
          </p>

          <div class="exportar-linha">
            <!-- [BACKEND] Meses disponíveis podem vir de GET /api/relatorios/meses-disponiveis.
               No protótipo, o main.js preenche os últimos 12 meses. -->
            <select
              class="filtro filtro-grande"
              id="mesReferencia"
              aria-label="Mês/Ano"
            ></select>

            <!-- [BACKEND] Gerar PDF: POST /api/relatorios/espelho { "mes": "2026-09" } -->
            <button class="btn btn-primario" id="btnGerarPdf">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                width="18"
                height="18"
              >
                <path
                  d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"
                />
                <path d="M14 3v6h6" />
              </svg>
              Gerar Relatório PDF
            </button>
          </div>
          <p
            class="mensagem-sucesso esquerda"
            id="msgRelatorio"
            role="status"
          ></p>
        </div>

        <!-- ---------- Saldo Acumulado Atual ---------- -->
        <!--
        [BACKEND] GET /api/banco-horas/saldo
          { "bancoHorasAtivo": true, "saldo": "+12h 30min", "positivo": true, "atualizadoEm": "13/09/2026" }
        - positivo = true  → verde | positivo = false → vermelho
        - bancoHorasAtivo = false → contrato sem banco de horas (ex.: Estágio, Fig. 20)
      -->
        <div class="card card-saldo saldo-positivo" id="cardSaldo">
          <h2 class="card-titulo">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            Saldo Acumulado Atual
          </h2>
          <p class="saldo-valor" id="saldoValor">--</p>
          <p class="texto-suave pequeno" id="saldoInfo">--</p>
        </div>
      </section>

      <!-- ======================================================
         LINHA 2: MEUS RELATÓRIOS ANTERIORES
         [BACKEND] GET /api/relatorios/espelho → lista dos PDFs já gerados
         ====================================================== -->
      <section class="card card-historico">
        <div class="historico-topo">
          <h2>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path d="M4 6h16M4 12h16M4 18h10" />
            </svg>
            Meus Relatórios Anteriores
          </h2>
        </div>

        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr>
                <th>Mês de Referência</th>
                <th>Data de Emissão</th>
                <th class="acoes">Ação</th>
              </tr>
            </thead>
            <!-- As linhas são preenchidas pelo main.js -->
            <tbody id="tabelaRelatorios"></tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Arquivo JS único (um nível acima, por isso o ../) -->
    <script src="../js/main.js"></script>
  </body>
</html>
