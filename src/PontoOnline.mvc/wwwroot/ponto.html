<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponto | Registro de Presença</title>
    <style>
      @import url("../css/style.css");
    </style>
  </head>
  <body class="pagina-app">
    <!-- ======================================================
       MENU LATERAL DO FUNCIONÁRIO (item "Ponto" ativo)
       ====================================================== -->
    <aside class="menu-lateral">
      <div class="menu-logo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 7v5l3 2" />
        </svg>
      </div>

      <nav class="menu-itens">
        <button class="menu-item" data-ir="inicio.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" />
          </svg>
          Início
        </button>
        <button class="menu-item ativo" data-ir="ponto.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          Ponto
        </button>
        <button class="menu-item" data-ir="relatorios.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M8 16v-3M12 16V9M16 16v-5" />
          </svg>
          Relatórios
        </button>
        <!-- [FRONT] Atestados abre um modal (Fig. 6). Será ligado quando fizermos essa tela. -->
        <button class="menu-item" data-ir="inicio.html#atestado">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="4" width="14" height="17" rx="2" />
            <path d="M9 4V3h6v1M12 10v6M9 13h6" />
          </svg>
          Atestados
        </button>
        <button class="menu-item" data-ir="configuracoes-funcionario.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"
            />
          </svg>
          Configurações
        </button>
      </nav>

      <button class="menu-item menu-ajuda">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01" />
        </svg>
        Ajuda
        <span class="seta-direita">›</span>
      </button>
    </aside>

    <!-- ======================================================
       CONTEÚDO PRINCIPAL
       ====================================================== -->
    <main class="conteudo">
      <!-- ---------- Cabeçalho (só o Meu Perfil, como no layout) ---------- -->
      <header class="topo topo-direita">
        <div class="perfil">
          <button class="perfil-botao" id="btnPerfil">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>
            Meu Perfil
            <span class="seta-baixo">⌄</span>
          </button>
          <div class="perfil-menu oculto" id="menuPerfil">
            <button data-ir="configuracoes-funcionario.html">Configurações</button>
            <!-- [BACKEND] Sair: POST /api/auth/logout -->
            <button id="btnSair">Sair</button>
          </div>
        </div>
      </header>

      <!-- ======================================================
         CARD DO PONTO: RELÓGIO + BOTÃO + LINHA DO TEMPO
         ====================================================== -->
      <section class="card card-ponto" id="cardPonto">
        <!-- [BACKEND] Relógio só para exibição. O horário OFICIAL da batida é o do servidor. -->
        <p class="ponto-hora" id="relogioHora">--:--:--</p>
        <p class="ponto-data" id="relogioData">--</p>
        <p class="ponto-dia" id="relogioDia">--</p>

        <!-- [BACKEND] Registrar batida: POST /api/pontos -->
        <button class="btn btn-primario btn-ponto" id="btnBaterPonto">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
          <span id="textoBtnPonto">Registrar Ponto</span>
        </button>

        <!--
        LINHA DO TEMPO DA JORNADA
        [BACKEND] GET /api/pontos/hoje → horários já registrados no dia:
          { "entrada": "08:00", "saidaAlmoco": "12:00", "retornoAlmoco": null, "saida": null }
        Cada etapa recebe uma classe pelo main.js:
          .concluida → já registrada (círculo azul com check)
          .proxima   → próxima batida esperada (destacada)
          (sem classe) → ainda não chegou a vez
      -->
        <ol class="linha-tempo" id="linhaTempo">
          <li class="etapa" data-etapa="entrada">
            <span class="etapa-icone">
              <svg
                class="ic-padrao"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"
                />
              </svg>
            </span>
            <span class="etapa-nome">Entrada</span>
            <strong class="etapa-hora">--:--</strong>
          </li>
          <li class="etapa" data-etapa="saidaAlmoco">
            <span class="etapa-icone">
              <svg
                class="ic-padrao"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M7 3v8M5 3v4a2 2 0 004 0V3M7 11v10M17 3c-2 0-3 2-3 5s1 4 3 4v9"
                />
              </svg>
            </span>
            <span class="etapa-nome">Saída Almoço</span>
            <strong class="etapa-hora">--:--</strong>
          </li>
          <li class="etapa" data-etapa="retornoAlmoco">
            <span class="etapa-icone">
              <svg
                class="ic-padrao"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M19 12H5M11 18l-6-6 6-6" />
              </svg>
            </span>
            <span class="etapa-nome">Retorno Almoço</span>
            <strong class="etapa-hora">--:--</strong>
          </li>
          <li class="etapa" data-etapa="saida">
            <span class="etapa-icone">
              <svg
                class="ic-padrao"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 012 2v14a2 2 0 01-2 2h-5"
                />
              </svg>
            </span>
            <span class="etapa-nome">Saída</span>
            <strong class="etapa-hora">--:--</strong>
          </li>
        </ol>
      </section>

      <!--
      BARRA DE AVISO
      .aviso-sucesso → verde (registro ok)
      .aviso-erro    → vermelho (ex.: [BACKEND] batida bloqueada por limite de jornada)
    -->
      <div class="aviso oculto" id="avisoPonto" role="status">
        <span class="aviso-icone" id="avisoIcone">✓</span>
        <span id="avisoTexto"></span>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
