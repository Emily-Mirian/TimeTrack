<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Registro de Presença</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="pagina-login">
    <main class="login-container">
      <!-- ===================== LADO ESQUERDO: ILUSTRAÇÃO ===================== -->
      <section class="login-ilustracao" aria-hidden="true">
        <!-- [FRONT] Para usar a ilustração final do layout, salve a imagem em
           img/login-ilustracao.png e troque o bloco .mockup por:
           <img src="img/login-ilustracao.png" alt="" class="ilustracao-img"> -->

        <span class="decor-mais d1">+</span>
        <span class="decor-mais d2">+</span>
        <span class="decor-mais d3">+</span>

        <!-- Balão de "joinha" -->
        <div class="balao-like">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M2 10h4v12H2zM22 11c0-1.1-.9-2-2-2h-6.3l1-4.6v-.3c0-.4-.2-.8-.4-1.1L13.2 2 7.6 7.6C7.2 8 7 8.5 7 9v10c0 1.1.9 2 2 2h9c.8 0 1.5-.5 1.8-1.2l3-7.1c.1-.2.2-.5.2-.7v-2z"
            />
          </svg>
        </div>

        <!-- Relógio decorativo -->
        <div class="relogio-decor">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </svg>
        </div>

        <!-- Celular com prévia do app -->
        <div class="mockup">
          <div class="mockup-topo">Registro de Presença</div>
          <div class="mockup-corpo">
            <div class="mockup-avatar"></div>
            <p class="mockup-ola">Olá, Colaborador!</p>
            <p class="mockup-sub">Ponto registrado com sucesso</p>
            <div class="mockup-check">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="3"
              >
                <path d="M5 12l5 5 9-10" />
              </svg>
            </div>
            <ul class="mockup-lista">
              <li><span>Data</span><span>--/--/----</span></li>
              <li><span>Horário</span><span>--:--</span></li>
              <li><span>Local</span><span>Escritório</span></li>
            </ul>
            <div class="mockup-botao">Ver histórico</div>
          </div>
        </div>
      </section>

      <!-- ===================== LADO DIREITO: FORMULÁRIO ===================== -->
      <section class="login-formulario">
        <h1>Login</h1>

        <!--
        [BACKEND] AUTENTICAÇÃO
        Endpoint sugerido: POST /api/auth/login
          Envia:   { "email": "...", "senha": "..." }
          Retorna: { "token": "...", "perfil": "funcionario" | "rh" | "admin", "nome": "..." }
        O redirecionamento é feito com base no "perfil" (ver js/login.js).
      -->
        <form id="formLogin" novalidate>
          <div class="grupo">
            <div class="campo" id="campoEmail">
              <svg
                class="icone"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="M3 7l9 6 9-6" />
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                autocomplete="username"
                required
              />
            </div>
            <p class="mensagem-erro" id="erroEmail"></p>
          </div>

          <div class="grupo">
            <div class="campo" id="campoSenha">
              <svg
                class="icone"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 018 0v4" />
              </svg>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Senha"
                autocomplete="current-password"
                required
              />
            </div>
            <p class="mensagem-erro" id="erroSenha"></p>
          </div>

          <!-- [BACKEND] Mensagem de erro retornada pela API (ex.: "E-mail ou senha inválidos") -->
          <p class="mensagem-erro erro-geral" id="erroGeral" role="alert"></p>

          <button type="submit" class="btn btn-escuro btn-login" id="btnLogin">
            Login
          </button>
        </form>

        <p class="link-cadastro">
          Não tem conta? <a href="cadastro.html">Cadastrar-se</a>
        </p>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
