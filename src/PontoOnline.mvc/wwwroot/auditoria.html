<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoria de Ponto | Portal do RH</title>
    <style>
      @import url("../css/style.css");
    </style>
  </head>
  <!-- data-acesso: perfis que podem abrir esta página ([BACKEND] validar no servidor) -->
  <body class="pagina-app" data-acesso="rh admin">
    <!-- ======================================================
       MENU LATERAL RH + ADMIN (item "Auditoria de Ponto" ativo)
       ====================================================== -->
    <aside class="menu-lateral">
      <div class="menu-logo">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"

        </svg>
      </div>

      <nav class="menu-itens">
        <p class="menu-secao" data-perfil="rh">Meu Ponto</p>
        <button class="menu-item" data-perfil="rh" data-ir="inicio.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" /></svg>
          Início
        </button>
        <button class="menu-item" data-perfil="rh" data-ir="ponto.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
          Registrar Ponto
        </button>
        <button class="menu-item" data-perfil="rh" data-ir="relatorios.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z" /><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3" /></svg>
          Exportar PDF
        </button>
        <button class="menu-item" data-perfil="rh" data-ir="inicio.html#atestado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="4" width="14" height="17" rx="2" /><path d="M9 4V3h6v1M12 10v6M9 13h6" /></svg>
          Enviar Atestado
        </button>
        <p class="menu-secao">Portal do RH</p>

        <button class="menu-item" data-ir="pendencias.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"
            />
            <rect x="9" y="3" width="6" height="4" rx="1" />
            <path d="M12 11v3M12 17h.01" />
          </svg>
          Pendências
        </button>
        <button class="menu-item" data-ir="importar.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M7 18a5 5 0 01-.5-9.98A6 6 0 0118 9a4.5 4.5 0 01-1 8.9" />
            <path d="M12 12v8M9 15l3-3 3 3" />
          </svg>
          Importar Planilhas (CSV)
        </button>
        <button class="menu-item" data-ir="exportar.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z" />
            <path d="M14 3v6h6M12 12v6M9 15l3 3 3-3" />
          </svg>
          Exportar Relatórios (PDF)
        </button>
        <button class="menu-item ativo" data-ir="auditoria.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          Auditoria de Ponto
        </button>
        <button class="menu-item" data-ir="configuracoes.html">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"
            />
          </svg>
          Configurações
        </button>

        <!-- ========== SÓ ADMIN ========== -->
        <p class="menu-secao" data-perfil="admin">Administração</p>

        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="visao-global.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          Visão Global
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="usuarios.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="9" cy="8" r="4" />
            <path
              d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4a4 4 0 010 8M22 21c0-3-2-5-4-5.5"
            />
          </svg>
          Gestão de Usuários
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="regras.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z" />
            <path d="M14 3v6h6M8 13h8M8 17h5" />
          </svg>
          Regras e Contratos
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="calendario.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" />
          </svg>
          Calendário e Feriados
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="permissoes.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 018 0v4" />
          </svg>
          Permissões de Acesso
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="configuracoes-globais.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path
              d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"
            />
          </svg>
          Configurações Globais
        </button>
        <button
          class="menu-item"
          data-perfil="admin"
          data-ir="logs.html"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" />
            <path d="M9 12h6M9 9h6M9 15h3" />
          </svg>
          Auditoria de Logs
        </button>
      </nav>
    </aside>

    <!-- ======================================================
       CONTEÚDO PRINCIPAL
       ====================================================== -->
    <main class="conteudo">
      <header class="topo">
        <div>
          <p class="topo-portal">Portal do RH</p>
          <h1>Auditoria de Ponto</h1>
          <p class="texto-suave">
            Rastreie as alterações feitas nos registros de jornada.
          </p>
        </div>

        <div class="perfil">
          <button class="perfil-botao" id="btnPerfil">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
            </svg>
            <span id="saudacaoPerfil">Olá, Gestor RH</span>
            <span class="seta-baixo">⌄</span>
          </button>
          <div class="perfil-menu oculto" id="menuPerfil">
            <button data-ir="configuracoes.html">Configurações</button>
            <button
              data-perfil="admin"
              data-ir="configuracoes-globais.html"
            >
              Configurações Globais
            </button>
            <button data-perfil="admin" data-ir="permissoes.html">
              Permissões de Acesso
            </button>
            <!-- [BACKEND] Sair: POST /api/auth/logout -->
            <button id="btnSair">Sair</button>
          </div>
        </div>
      </header>

      <!-- ======================================================
         CONSULTA DE LOGS E MODIFICAÇÕES (filtros)
         [BACKEND] GET /api/rh/auditoria?periodo=7d&ator=rh&tipo=edicao_ponto
         ====================================================== -->
      <section class="card" id="cardAuditoria">
        <h2 class="card-titulo">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <path d="M3 5h18l-7 8v6l-4 2v-8z" />
          </svg>
          Consulta de Logs e Modificações
        </h2>

        <form id="formAuditoria" class="filtros-grade" novalidate>
          <div class="campo-modal">
            <label for="filtroPeriodo">Período (Data)</label>
            <select id="filtroPeriodo">
              <option value="hoje">Hoje</option>
              <option value="7" selected>Últimos 7 dias</option>
              <option value="30">Últimos 30 dias</option>
              <option value="90">Últimos 90 dias</option>
            </select>
          </div>

          <div class="campo-modal">
            <label for="filtroAtor">Usuário / Autor</label>
            <select id="filtroAtor">
              <option value="todos">Todos</option>
              <option value="rh">Gestor RH</option>
              <option value="admin">Administrador</option>
              <option value="sistema">Sistema</option>
            </select>
          </div>

          <div class="campo-modal">
            <label for="filtroEvento">Tipo de Evento</label>
            <select id="filtroEvento">
              <option value="todos">Todos</option>
              <option value="edicao_ponto">Edição de ponto</option>
              <option value="excesso_jornada">Tratamento de excesso de jornada</option>
              <option value="modulo">Controle de módulos</option>
              <option value="atestado">Validação de atestado</option>
              <option value="bloqueio">Bloqueio de acesso</option>
              <option value="cadastro">Cadastro de usuário</option>
              <option value="importacao">Importação de planilha</option>
            </select>
          </div>

          <div class="filtros-botoes">
            <button
              type="button"
              class="btn btn-contorno"
              id="btnLimparFiltros"
            >
              Limpar
            </button>
            <button type="submit" class="btn btn-primario">
              Aplicar Filtros
            </button>
          </div>
        </form>
      </section>

      <!-- ======================================================
         HISTÓRICO DE ATIVIDADES
         [BACKEND] Cada linha vem do log gravado pelo SERVIDOR.
         O log é SOMENTE LEITURA: ninguém pode editar ou apagar.
         ====================================================== -->
      <section class="card card-historico">
        <div class="historico-topo">
          <h2>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            Histórico de Atividades
            <span class="contador" id="contadorAuditoria">0</span>
          </h2>
        </div>

        <div class="tabela-wrap">
          <table class="tabela">
            <thead>
              <tr>
                <th>Data e Hora</th>
                <th>Usuário (Autor)</th>
                <th>Ação Realizada</th>
                <th>Detalhes da Alteração</th>
              </tr>
            </thead>
            <!-- Linhas preenchidas pelo main.js -->
            <tbody id="tabelaAuditoria"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
  </body>
</html>
