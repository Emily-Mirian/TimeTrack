<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel do Gestor - Time tracl</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="menu-lateral">
        <div class="logo">⏱ Time track</div>
        <nav>
          <a href="#pendencias">Pendências</a>
          <a href="#auditoria">Auditoria</a>
        </nav>
      </aside>

      <main class="conteudo">
        <header class="topo">
          <div>
            <h1>Setor de Qualidade</h1>
            <small>Gestor: <span id="nome-usuario"></span></small>
          </div>
          <details class="perfil">
            <summary>👤 Meu perfil</summary>
            <button class="btn" id="btn-sair">Sair</button>
          </details>
        </header>
        <section class="card" id="pendencias">
          <h2>Ações requeridas</h2>
          <div class="tabela-rolagem">
            <table id="tabela-pendencias">
              <thead>
                <tr>
                  <th>Colaborador</th>
                  <th>Ocorrência</th>
                  <th>Ação rápida</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
        <section class="card" id="auditoria">
          <h2>Auditoria recente</h2>
          <div class="tabela-rolagem">
            <table id="tabela-auditoria">
              <thead>
                <tr>
                  <th>Usuário</th>
                  <th>Ação</th>
                  <th>Data/hora</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/gestor.js"></script>
  </body>
</html>
