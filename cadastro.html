<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar-se - Time track</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth auth-unico">
      <section class="auth-form">
        <form id="form-cadastro">
          <h1>Cadastrar-se</h1>

          <input
            class="campo"
            type="text"
            id="nome"
            placeholder="Nome"
            required
          />
          <input
            class="campo"
            type="email"
            id="email"
            placeholder="E-mail"
            required
          />
          <input
            class="campo"
            type="password"
            id="senha"
            placeholder="Senha (mínimo 8 caracteres)"
            required
          />
          <input
            class="campo"
            type="password"
            id="confirmar-senha"
            placeholder="Confirmar senha"
            required
          />

          <p class="erro" id="erro"></p>

          <button class="btn" type="submit">Criar conta</button>
          <a href="login.html">Já tenho conta</a>
        </form>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
