<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time track - Redirecionando...</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth auth-unico">
      <section class="auth-form">
        <h1>⏱ Time track</h1>
        <p>A carregar o sistema...</p>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script>
      const usuario = pegarUsuario();

      if (usuario && usuario.perfil) {
        const paginas = {
          func: "funcionario.html",
          gestor: "gestor.html",
          admin: "admin.html",
        };
        window.location.href = paginas[usuario.perfil] || "login.html";
      } else {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
